# Perfil "test": H2 em memoria (modo MySQL) e credenciais fixas, so para os testes automatizados
spring.datasource.url=jdbc:h2:mem:biblioteca;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Roda o data.sql (leitores ficticios) depois do Hibernate criar as tabelas
spring.sql.init.mode=always

biblioteca.bibliotecario-inicial.usuario=bibliotecario
biblioteca.bibliotecario-inicial.senha=senha-de-teste
