<!DOCTYPE html>
<html xmlns:th="https://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="shortcut icon" th:href="@{/Logo.png}" type="image/x-icon">
    <link rel="stylesheet" type="text/css" th:href="@{/css/style2.css}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>Biblioteca Luiz Brasil - Garanhuns</title>
</head>
<body>
    <div class="conteiner">
        <div class="imagem">
            <img th:src="@{/Logo.png}" width="400" height="380">
            <div class="nomes">
                <h1>BIBLIOTECA</h1>
                <h2>Luiz Brasil</h2>
            </div>
        </div>

        <div class="formulario">
            <form action="#">
                <div class="titulo">
                    <h1>LOGIN</h1>
                    <h3>Bem-vindo de volta, leitor!</h3>

                </div>
                        
                <div class="agrupamento">

                    <div class="input-box">
                        <input id="cpf" type="text" name="cpf" placeholder="CPF" required>
                    </div>

                    <div class="input-box">
                        <input id="password" type="password" name="password" placeholder="Senha" required>
                    </div>
                </div>

                <div class="botao_confirmar">
                    <button><a href="/autenticacao/login/leitor"><u>CONFIRMAR</u></a></button>
                </div>
                
                <div class="botao_esqueceuS">
                    <button><a href="#"><u>Esqueceu a senha?</u></a></button>
              </div>
            </form>
        </div>
    </div>
</body>
</html>
