spring.application.name=ProjetoBiblioteca

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/biblioteca
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cria/atualiza as tabelas e roda o data.sql 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

biblioteca.bibliotecario-inicial.usuario=${BIBLIOTECA_USUARIO:bibliotecario}
biblioteca.bibliotecario-inicial.senha=${BIBLIOTECA_SENHA:123456}
# E-mail do bibliotecario inicial (necessario para testar "Esqueci a senha" com ele)
biblioteca.bibliotecario-inicial.email=${BIBLIOTECA_EMAIL:}

# Origens liberadas para o front React (Vite). Separe por virgula se precisar de mais de uma.
biblioteca.cors.origins=${BIBLIOTECA_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}

# Mostra a mensagem das regras de negocio no corpo das respostas de erro
server.error.include-message=always
server.error.include-binding-errors=always

# Server
server.port=${PORT:8081}
server.error.include-message=always

file.upload-dir=uploads

# Configuracoes do Spring Mail para o Brevo (SMTP)
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.from=
